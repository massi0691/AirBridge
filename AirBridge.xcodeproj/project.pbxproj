			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Embbarque FinderService.appex uniquement sur macOS\n# (la phase standard Embed App Extensions + platformFilters ne fonctionne pas\n#  dans ce target multiplateforme objectVersion 77 : l'embed fuit vers iOS)\n# De plus, le User Script Sandboxing refuse la lecture recursive d'un input-bundle.\n# Le sandbox de CETTE phase est donc desactive via le build setting\n# ENABLE_USER_SCRIPT_SANDBOXING[sdk=macosx*] = NO (configs Debug/Release d'AirBridge).\n# Sur iOS (PLATFORM_NAME != macosx) cette phase est un no-op : aucun appex embarque.\nif [ \"${PLATFORM_NAME}\" = \"macosx\" ]; then\n    SRC=\"${CONFIGURATION_BUILD_DIR}/FinderService.appex\"\n    DST=\"${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/PlugIns\"\n    if [ -d \"${SRC}\" ]; then\n        /bin/mkdir -p \"${DST}\"\n        /usr/bin/ditto \"${SRC}\" \"${DST}/FinderService.appex\"\n    fi\nfi\n";
		};
